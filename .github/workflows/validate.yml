name: Validate Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: |
          uv python install 3.14

      - name: Clone Hermes Agent (main)
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent

      - name: Install Hermes Agent and Dependencies
        run: |
          cd /tmp/hermes-agent
          uv venv .venv --python 3.14
          uv sync
          echo "/tmp/hermes-agent/.venv/bin" >> $GITHUB_PATH

      - name: Inspect Hermes CLI
        run: |
          which hermes
          hermes plugins --help

      - name: Run Plugin Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Hermes Plugin Validation
        run: |
          hermes plugins validate . --install-deps

      - name: Run Hermes Plugin Doctor
        run: |
          hermes plugins doctor . --ci
