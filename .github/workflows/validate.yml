name: Validate Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate (${{ matrix.hermes_ref }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hermes_ref: [main, v0.22.3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        continue-on-error: true
        with:
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure uv is installed
        run: |
          if ! command -v uv &> /dev/null; then
            echo "setup-uv encountered an issue, installing uv via official installer..."
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi

      - name: Set up Python
        run: |
          uv python install 3.14

      - name: Clone Hermes Agent (${{ matrix.hermes_ref }})
        run: |
          git clone --depth 1 --branch ${{ matrix.hermes_ref }} https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent || {
            echo "Shallow clone failed, falling back to full clone for ref ${{ matrix.hermes_ref }}..."
            git clone https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
            cd /tmp/hermes-agent
            git checkout ${{ matrix.hermes_ref }}
          }

      - name: Install Hermes Agent and Dependencies
        run: |
          cd /tmp/hermes-agent
          uv venv .venv --python 3.14
          echo "Attempting uv sync --frozen..."
          if ! uv sync --frozen; then
            echo "uv sync --frozen failed, attempting uv sync..."
            if ! uv sync; then
              echo "uv sync failed, falling back to uv pip install -e . ..."
              uv pip install -e .
            fi
          fi
          echo "/tmp/hermes-agent/.venv/bin" >> $GITHUB_PATH

      - name: Inspect Hermes CLI
        run: |
          which hermes
          hermes plugins --help

      - name: Run Plugin Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Hermes Plugin Validation
        run: |
          hermes plugins validate . --install-deps

      - name: Run Hermes Plugin Doctor
        run: |
          hermes plugins doctor . --ci
