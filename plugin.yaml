name: hermes-detox
version: "0.1.0"
description: "Tool output firewall for Hermes Agent. Compacts oversized tool and terminal outputs, sanitizes with Hermes pattern-based redaction helpers, stores in unencrypted local SQLite WAL, and delivers compact reports with on-demand retrieval tools."
author: "kellycryptos"
requires_hermes: ">=0.22.3"

provides_hooks:
  - transform_tool_result
  - transform_terminal_output
  - on_session_reset
  - post_compaction
  - on_session_delete

provides_tools:
  - detox_inspect
  - detox_search
  - detox_status

config_schema:
  enabled:
    type: boolean
    default: true
    description: "Enable or disable Detox firewall interception"
  min_size:
    type: integer
    default: 6000
    description: "Minimum character threshold to trigger compression and local storage"
  max_report_chars:
    type: integer
    default: 3000
    description: "Maximum character budget for compact reports"
  max_ratio:
    type: float
    default: 0.55
    description: "Maximum compression ratio (report size / original size) allowed before fail-open"
  head_lines:
    type: integer
    default: 5
    description: "Number of leading lines included in compact report preview"
  tail_lines:
    type: integer
    default: 5
    description: "Number of trailing lines included in compact report preview"
  excluded_tools:
    type: array
    items:
      type: string
    default:
      - browser_vision
      - browser_snapshot
      - image_generate
      - video_generate
      - video_analyze
      - vision_analyze
      - text_to_speech
      - patch
      - write_file
    description: "List of tool names exempted from Detox firewall interception (defaults to vision, media, and file editing tools)"
  retention_days:
    type: integer
    default: 30
    description: "Days to retain stored evidence records before pruning"
  max_store_size_mb:
    type: integer
    default: 100
    description: "Maximum local evidence store size in megabytes before pruning oldest records"
  debug:
    type: boolean
    default: false
    description: "Enable verbose debug logging for Detox operations"
